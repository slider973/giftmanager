# Build iOS signé + envoi TestFlight (Xcode 26 requis par Apple, indisponible sur macOS 14).
#
# Déclenchement (GitLab Flow) :
#   - automatique sur tag `v*` (ex. `git tag -a v1.1.0 -m "..." && git push origin v1.1.0`),
#     via scripts/release.sh qui vérifie l'état du dépôt avant de poser le tag ;
#   - manuel (gh workflow run ios-release.yml) pour rejouer un build sans créer de version.
#
# La version marketing provient du tag : `v1.1.0` → MARKETING_VERSION 1.1.0. Elle est donc
# toujours cohérente entre le dépôt et App Store Connect, sans édition manuelle de project.yml.
name: iOS release (TestFlight)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: astral-sh/setup-uv@v6

      - name: Outils
        run: brew install xcodegen

      # Un tag `v1.1.0` fixe la version marketing ; un lancement manuel garde celle de project.yml.
      - name: Version depuis le tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "marketing=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive et envoi TestFlight
        id: release
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: scripts/apple/ci-release.sh

      - name: Distribution TestFlight (groupes, textes, vérification bêta)
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: uv run scripts/apple/testflight.py "${{ steps.release.outputs.build_number }}"

      - name: Résumé
        run: echo "Build ${{ steps.release.outputs.build_number }} envoyé sur TestFlight ($(xcodebuild -version | head -1))" >> "$GITHUB_STEP_SUMMARY"
