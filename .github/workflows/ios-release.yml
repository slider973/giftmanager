# Build iOS signé + envoi TestFlight (Xcode 26 requis par Apple, indisponible sur macOS 14).
# Déclenchement : manuel (gh workflow run ios-release.yml) ou via scripts/apple/release.sh.
name: iOS release (TestFlight)

on:
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: astral-sh/setup-uv@v6

      - name: Outils
        run: brew install xcodegen

      - name: Archive et envoi TestFlight
        id: release
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: scripts/apple/ci-release.sh

      - name: Distribution TestFlight (groupes, textes, vérification bêta)
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: uv run scripts/apple/testflight.py "${{ steps.release.outputs.build_number }}"

      - name: Résumé
        run: echo "Build ${{ steps.release.outputs.build_number }} envoyé sur TestFlight ($(xcodebuild -version | head -1))" >> "$GITHUB_STEP_SUMMARY"
