# APK Android signé, à installer directement (testeurs hors Google Play, ex. Marina) — #111.
#
# Ce n'est PAS une version : rien n'est envoyé à Play, aucune étiquette. Les versions passent par
# release.sh (tag vX.Y.Z) → android-release.yml. Ici, l'APK release est construit avec la vraie
# configuration (secrets GitHub) et signé avec la clé d'upload, puis gardé 14 jours en artefact.
#
# Installer : télécharger l'artefact, transmettre le .apk, l'ouvrir sur le téléphone en autorisant
# les « sources inconnues ». Limite : signé avec la clé d'upload et non la clé Play App Signing, la
# connexion Google échoue si la SHA-1 de la clé d'upload n'est pas déclarée (docs/SECRETS.md).
name: Android APK (test hors Play)

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Une PR venant d'un fork n'a pas accès aux secrets : l'APK serait factice et non signé.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Même clé que android-release.yml, décodée dans le dossier temporaire du runner.
      - name: Clé d'upload
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent (voir docs/SECRETS.md)"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "name=0.0.0-${sha::7}" >> "$GITHUB_OUTPUT"
          echo "code=$(scripts/android/version-code.sh)" >> "$GITHUB_OUTPUT"

      # assembleRelease dépend de checkReleaseSecrets : il échoue si une valeur est factice.
      - name: APK release signé
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APPLE_SIGN_IN_ENABLED: ${{ secrets.APPLE_SIGN_IN_ENABLED }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      # Un APK non signé ne s'installe pas : on le vérifie plutôt que de livrer un fichier inutilisable.
      - name: Signature présente
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::APK signé absent ($apk) : signature release non configurée ?"; ls -R android/app/build/outputs/apk; exit 1; }
          "$ANDROID_HOME"/build-tools/"$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)"/apksigner verify "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: giftmanager-${{ steps.version.outputs.name }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Résumé
        run: echo "APK ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}) — à installer hors Play, rien n'est publié." >> "$GITHUB_STEP_SUMMARY"
