name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS — build et tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Tests unitaires
        working-directory: ios
        run: |
          xcodegen generate --quiet
          SIM=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project GiftManager.xcodeproj -scheme GiftManager \
            -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO -quiet

  android:
    name: Android — build, tests et lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, tests unitaires et lint
        working-directory: android
        env:
          # Valeurs factices : la CI ne diffuse rien et n'a besoin d'aucun secret.
          SUPABASE_URL: https://ci.invalid
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          GOOGLE_WEB_CLIENT_ID: ci-dummy.apps.googleusercontent.com
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

  supabase:
    name: Supabase — lint et tests SQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Les ports du projet (55420-55429, supabase/config.toml) tombent dans la plage éphémère de
      # Linux (32768-60999) : une connexion sortante (téléchargements Docker) peut en prendre un juste
      # avant que la base ne s'y lie — « address already in use » (#110). On borne la plage en dessous.
      - name: Ports Supabase hors de la plage éphémère
        run: sudo sysctl -w net.ipv4.ip_local_port_range="32768 54999"
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - run: supabase db lint --fail-on error
      - run: supabase test db

  edge-functions:
    name: Edge functions — tests Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Vérification des types des fonctions
        run: deno check supabase/functions/*/index.ts
      - name: Tests (envoi push, suivi des prix)
        run: deno test --allow-env --allow-read supabase/functions/_shared supabase/functions/track-prices
