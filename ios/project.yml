name: GiftManager
options:
  bundleIdPrefix: ch.jonathanlemaine
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"

targets:
  GiftManager:
    type: application
    platform: iOS
    sources:
      - path: GiftManager
    dependencies:
      - package: Supabase
    entitlements:
      path: GiftManager/GiftManager.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: GiftManager/Info.plist
      properties:
        CFBundleDisplayName: Famille Cadeaux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        NSCameraUsageDescription: Pour prendre en photo un cadeau à ajouter à la liste.
        NSPhotoLibraryUsageDescription: Pour choisir la photo d'un cadeau ou d'un enfant.
        CFBundleURLTypes:
          - CFBundleURLName: ch.jonathanlemaine.giftmanager
            CFBundleURLSchemes: [famillecadeaux]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jonathanlemaine.giftmanager
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Distribution : certificat et profil créés par scripts/apple/setup-distribution.sh
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Famille Cadeaux App Store

  GiftManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GiftManagerTests
    dependencies:
      - target: GiftManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jonathanlemaine.giftmanager.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GiftManager:
    build:
      targets:
        GiftManager: all
        GiftManagerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [GiftManagerTests]
    archive:
      config: Release
