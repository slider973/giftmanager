name: GiftManager
options:
  bundleIdPrefix: ch.jonathanlemaine
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"

targets:
  GiftManager:
    type: application
    platform: iOS
    sources:
      - path: GiftManager
    dependencies:
      - package: Supabase
      - target: GiftManagerShare
      - target: GiftManagerWidget
    entitlements:
      path: GiftManager/GiftManager.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        keychain-access-groups: [$(AppIdentifierPrefix)ch.jonathanlemaine.giftmanager.shared]
    info:
      path: GiftManager/Info.plist
      properties:
        CFBundleDisplayName: Gift Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [remote-notification]
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSCameraUsageDescription: Pour prendre en photo un cadeau à ajouter à la liste.
        NSPhotoLibraryUsageDescription: Pour choisir la photo d'un cadeau ou d'un enfant.
        NSFaceIDUsageDescription: Pour qu'un adulte puisse quitter le mode enfant.
        CFBundleURLTypes:
          - CFBundleURLName: ch.jonathanlemaine.giftmanager
            CFBundleURLSchemes: [famillecadeaux]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jonathanlemaine.giftmanager
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Distribution : certificat et profil créés par scripts/apple/setup-distribution.sh
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Famille Cadeaux App Store

  GiftManagerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: GiftManagerShare
      - path: GiftManager/Core
      - path: GiftManager/DesignSystem
      - path: GiftManager/Resources
      - path: GiftManager/Services/GiftRepository.swift
      - path: GiftManager/Services/SupabaseService.swift
      - path: GiftManager/Services/LinkPreviewService.swift
      - path: GiftManager/Services/StoreCatalog.swift
    dependencies:
      - package: Supabase
    entitlements:
      path: GiftManagerShare/GiftManagerShare.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)ch.jonathanlemaine.giftmanager.shared]
    info:
      path: GiftManagerShare/Info.plist
      properties:
        CFBundleDisplayName: Gift Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jonathanlemaine.giftmanager.share
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Gift Manager Share App Store

  GiftManagerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GiftManagerWidget
      - path: GiftManager/Core
      - path: GiftManager/DesignSystem/Tokens
      - path: GiftManager/Resources/Assets.xcassets
      - path: GiftManager/Services/GiftRepository.swift
      - path: GiftManager/Services/SupabaseService.swift
    dependencies:
      - package: Supabase
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: GiftManagerWidget/GiftManagerWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)ch.jonathanlemaine.giftmanager.shared]
    info:
      path: GiftManagerWidget/Info.plist
      properties:
        CFBundleDisplayName: Gift Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jonathanlemaine.giftmanager.widget
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Gift Manager Widget App Store

  GiftManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GiftManagerTests
    dependencies:
      - target: GiftManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jonathanlemaine.giftmanager.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GiftManager:
    build:
      targets:
        GiftManager: all
        GiftManagerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [GiftManagerTests]
    archive:
      config: Release
